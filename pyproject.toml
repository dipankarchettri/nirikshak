[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak"
version = "0.1.0"
description = "Hardware-in-the-loop stress test and drift-robust eavesdropper detector for BB84 QKD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dipankar Chettri" },
    { name = "J Bhuvanesh" },
    { name = "Anusha A" },
]
keywords = ["quantum key distribution", "BB84", "eavesdropper detection", "qiskit", "conformal prediction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "qiskit>=2.5",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "plotly",
    "streamlit",
]

[project.urls]
Homepage = "https://github.com/dipankarchettri/nirikshak"
Issues = "https://github.com/dipankarchettri/nirikshak/issues"
"Live app" = "https://dipankarchettri.github.io/nirikshak/"

[project.optional-dependencies]
qml = ["qiskit-machine-learning"]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
include = ["nirikshak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Load the Linux libgomp workaround before pytest starts capturing output (it may restart the process).
addopts = "-p nirikshak._runtime"
